<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scanner</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">immich-scanner</p>
        <h1>Flatbed</h1>
      </div>
      <nav>
        <button type="button" class="tab active" data-tab="scan">Scan</button>
        <button type="button" class="tab" data-tab="settings">Settings</button>
      </nav>
    </header>

    <main>
      <section id="scan" class="panel">
        <div class="status-grid" id="status-grid">
          <article data-key="scanner">
            <h2>Scanner</h2>
            <p class="lamp" id="scanner-lamp">Checking</p>
            <p class="detail" id="scanner-detail"></p>
          </article>
          <article data-key="server">
            <h2>Server</h2>
            <p class="lamp" id="server-lamp">Checking</p>
            <p class="detail" id="server-detail"></p>
          </article>
          <article data-key="last">
            <h2>Last scan</h2>
            <p class="lamp" id="last-lamp">None yet</p>
            <p class="detail" id="last-detail"></p>
          </article>
        </div>
        <div class="action">
          <button type="button" id="scan-button">Scan bed</button>
          <p id="phase" class="phase">Idle</p>
        </div>
        <p id="banner" class="banner" hidden></p>
      </section>

      <section id="settings" class="panel" hidden>
        <form id="settings-form">
          <label>
            Server URL
            <input name="server_url" type="url" required placeholder="http://homeserver.local:8080" />
          </label>
          <label>
            API token
            <input name="api_token" type="password" autocomplete="off" />
          </label>
          <label>
            Scanner
            <select name="device_name" id="device-select"></select>
          </label>
          <label>
            Resolution (dpi)
            <input name="resolution_dpi" type="number" min="50" max="4800" step="1" required />
          </label>
          <label>
            Format
            <select name="image_format">
              <option value="tiff">TIFF (lossless)</option>
              <option value="png">PNG (lossless)</option>
            </select>
          </label>
          <label>
            Mode
            <select name="mode">
              <option value="Color">Color</option>
              <option value="Gray">Gray</option>
            </select>
          </label>
          <div class="pair">
            <label>
              Width (mm, optional)
              <input name="width_mm" type="number" min="1" max="400" step="0.1" placeholder="Full bed" />
            </label>
            <label>
              Height (mm, optional)
              <input name="height_mm" type="number" min="1" max="400" step="0.1" placeholder="Full bed" />
            </label>
          </div>
          <p class="hint">Leave width and height empty to scan the whole bed. The LiDE 700F bed is about 216 × 297 mm.</p>
          <button type="submit">Save settings</button>
          <p id="save-note" class="detail"></p>
        </form>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
