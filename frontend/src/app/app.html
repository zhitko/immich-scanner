<header class="top">
  <div class="top-inner">
    <a class="brand" routerLink="/scans" aria-label="Scanner desk">
      <span class="brand-mark" aria-hidden="true">
        <svg class="i" viewBox="0 0 24 24">
          <path
            d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"
          />
        </svg>
      </span>
      <h1>Scanner desk</h1>
    </a>
    <nav aria-label="Main">
      <a routerLink="/scans" routerLinkActive="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22 12h-6l-2 3h-4l-2-3H2" />
          <path
            d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"
          />
        </svg>
        <span>Scans</span>
      </a>
      <a routerLink="/photos" routerLinkActive="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8" cy="8" r="1" />
          <path d="m21 15-5-5L5 21" />
        </svg>
        <span>Photos</span>
      </a>
      <a routerLink="/retouch" routerLinkActive="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 17 11-11 4 4L7 21H3v-4ZM12 8l4 4M5 2v4M3 4h4M19 2v4M17 4h4" />
        </svg>
        <span>Retouch</span>
      </a>
      <a routerLink="/upload" routerLinkActive="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 16V3m-5 5 5-5 5 5M3 16v5h18v-5" />
        </svg>
        <span>Upload</span>
      </a>
      <a routerLink="/matching" routerLinkActive="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="5" width="8" height="14" rx="2" />
          <rect x="14" y="5" width="8" height="14" rx="2" />
          <path d="M10 12h4" />
        </svg>
        <span>Matching</span>
      </a>
      <a routerLink="/jobs" routerLinkActive="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
        <span>Jobs</span>
      </a>
      <a routerLink="/statistics" routerLinkActive="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 3v18h17M9 16v-4M14 16V8M19 16V5" />
        </svg>
        <span>Statistics</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 7h-9M14 17H5" />
          <circle cx="17" cy="17" r="3" />
          <circle cx="7" cy="7" r="3" />
        </svg>
        <span>Settings</span>
      </a>
    </nav>
    <button
      type="button"
      class="icon ghost theme-toggle"
      [title]="'Theme: ' + theme() + ' (click to change)'"
      [attr.aria-label]="'Theme: ' + theme()"
      (click)="cycleTheme()"
    >
      @switch (theme()) {
        @case ('light') {
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
        }
        @case ('dark') {
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        }
        @default {
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="20" height="14" x="2" y="3" rx="2" />
            <path d="M8 21h8M12 17v4" />
          </svg>
        }
      }
    </button>
  </div>
</header>
<main>
  <router-outlet />
</main>
