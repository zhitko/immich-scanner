# Review server. Run this on the home server.
#
#   cp server/.env.example server/.env
#   docker compose -f docker-compose.server.yml up --build
#
# Without a real Immich instance, add the mock profile. Point Immich at
# http://mock-immich:3001 from the settings page (or IMMICH_BASE_URL before
# the first boot).
#
#   docker compose -f docker-compose.server.yml --profile mock up --build
services:
  scanner-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: immich-scanner-server
    ports:
      - "8080:8000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/static
    volumes:
      - server-data:/data
    restart: unless-stopped

  mock-immich:
    profiles: ["mock"]
    build:
      context: ./server/backend
      dockerfile: Dockerfile.mock
    image: immich-scanner-mock
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  server-data:
