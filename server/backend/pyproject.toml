[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-scanner-server"
version = "0.1.0"
description = "Review detected flatbed photos and upload them to Immich."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "piexif>=1.1.3",
  "pillow>=11.0",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*", "mock_immich*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI uses Depends(), File(), and Form() in parameter defaults.
ignore = ["B008"]
